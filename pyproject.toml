[project]
name = "agentic-design-patterns"
version = "0.1.0"
description = "Agentic design patterns with LangGraph 1.x + LangChain 1.x, running locally on Ollama (llama3.1 & qwen3:0.6b)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2,<2",          # tested with 1.2.12
    "langchain>=1.4,<2",          # tested with 1.4.3  (create_agent, middleware)
    "langchain-ollama>=1.1,<2",   # tested with 1.1.0  (ChatOllama)
    "pydantic>=2",
]

[dependency-groups]
notebook = [
    "jupyterlab>=4",
    "ipykernel>=6",
]

[tool.uv]
package = false                   # this is a notebook collection, not an installable library
default-groups = ["notebook"]
